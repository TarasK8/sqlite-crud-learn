<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бібліотека – SQLite CRUD</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 a { color: inherit; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: .45rem .6rem; text-align: left; }
    th { background: #f2f2f2; }
    .btn { display: inline-block; padding: .35rem .8rem; border: 1px solid #888; border-radius: 4px;
           background: #fff; color: #222; text-decoration: none; cursor: pointer; font: inherit; }
    .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-danger { border-color: #dc2626; color: #dc2626; }
    form.inline { display: inline; }
    label { display: block; margin: .7rem 0 .2rem; }
    input[type=text], input[type=number] { width: 100%; padding: .4rem; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1><a href="/">Бібліотека</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
